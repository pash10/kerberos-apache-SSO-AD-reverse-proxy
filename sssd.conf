
[sssd]
#services = ifp
socket_activated_services = nss, pam, sudo, autofs, ifp
config_file_version = 2
domains = EXAMPLE.INVALID
debug_level = 0
[domain/EXAMPLE.INVALID]
ad_server= ad-server.EXAMPLE.INVALID
id_provider = ad
access_provider = ad
auth_provider = ad
ad_domain = EXAMPLE.INVALID
ldap_sasl_authid = host/proxy.EXAMPLE.INVALID@EXAMPLE.INVALID
debug_level = 0

ad_access_filter = (memberOf=CN=ProxyUsers,OU=Groups,DC=example,DC=invalid)
krb5_realm = EXAMPLE.INVALID
krb5_kdcip = ad-server.EXAMPLE.INVALID
krb5_keytab = /etc/krb5.keytab
krb5_server =ad-server.EXAMPLE.INVALID
krb5_store_password_if_offline = False
cache_credentials = False
ldap_id_mapping = True
use_fully_qualified_names = False
enumerate = False
ldap_referrals = False
case_sensitive = False
override_homedir = /home/%u
fallback_homedir = /home/%u


[ifp]
allowed_uids = 0, 33
user_attributes = +givenName, +sn
debug_level = 0



